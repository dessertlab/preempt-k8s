apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: knservice-rtresource-${RT_NUM}
  namespace: ${NAMESPACE}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/application-criticality-level: "${CRITICALITY_LEVEL}"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - ${NON_FEASIBLE_NODE_1}
                      - ${NON_FEASIBLE_NODE_2}
      containers:
        - name: knservice-container
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: Never
