apiVersion: apps/v1
kind: Deployment
metadata:
  name: interfering-deployment-${DP_NUM}
  namespace: ${NAMESPACE}
  labels:
    app: interfering-deployment-${DP_NUM}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interfering-deployment-${DP_NUM}
  template:
    metadata:
      name: interfering-pod-${DP_NUM}
      namespace: ${NAMESPACE}
      labels:
        app: interfering-deployment-${DP_NUM}
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        kubernetes.io/hostname: ${NODE}
      containers:
      - name: interfering-container
        image: registry.k8s.io/pause:3.10
        imagePullPolicy: Never
