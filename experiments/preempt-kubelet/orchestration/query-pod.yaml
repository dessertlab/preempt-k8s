apiVersion: v1
kind: Pod
metadata:
  name: query-pod
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: dessertw3
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  containers:
    - name: query-container
      image: curlimages/curl:latest
      command: ["tail", "-f", "/dev/null"]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: true
        privileged: true
        readOnlyRootFilesystem: false
      volumeMounts:
        - name: experiments-results
          mountPath: /experiments
  volumes:
    - name: experiments-results
      persistentVolumeClaim:
        claimName: experiments-results
